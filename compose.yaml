name: universum-antares-${APP_ENV:?Defina APP_ENV como dev ou prod}

services:
  antares:
    build: .
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: ${APP_ENV:?Defina APP_ENV como dev ou prod}
      SERVER_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?Defina o banco deste ambiente}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Defina o usuario do banco}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Defina a senha do banco}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Defina as origens do frontend}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    # Porta interna; chamadas externas entram pelo Polaris.
    expose:
      - "8080"
    networks:
      services:
        aliases:
          - antares
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  # Mesma rede do Polaris deste ambiente. O ingresso do Dokploy e gerenciado pelo painel.
  services:
    external: true
    name: universum-${APP_ENV:?Defina APP_ENV como dev ou prod}
