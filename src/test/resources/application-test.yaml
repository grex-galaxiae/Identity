spring:
  flyway:
    enabled: true
  datasource:
    url: jdbc:h2:mem:testdb;DATABASE_TO_LOWER=TRUE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  cache:
    type: none

app:
  cors:
    allowed-origins: http://localhost:4200

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
