server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: universum-antares
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    issuer: https://production.coeur.app.br
  rate-limit:
    trusted-proxies: ${TRUSTED_PROXIES:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://production.coeur.app.br}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
